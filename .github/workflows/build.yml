name: Build

on:
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: neodba-linux-x86_64
            archive: target/neodba
          - os: windows-latest
            artifact: neodba-windows-x86_64
            archive: target/neodba.exe
          - os: macos-latest
            artifact: neodba-macos-aarch64
            archive: target/neodba
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '24'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zlib1g-dev
          curl -sL https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz | tar -xz -C /tmp
          cd /tmp/zlib-1.3.1
          CC=musl-gcc ./configure --static --prefix=/tmp/zlib-musl
          make
          sudo cp /tmp/zlib-1.3.1/libz.a /usr/lib/x86_64-linux-musl/

      - name: Build native binary
        shell: bash
        env:
          MUSL_HOME: /usr
          NATIVE_IMAGE_MEM: 4g
        run: ./bin/graalify

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
